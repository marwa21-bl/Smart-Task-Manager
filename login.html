<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | Smart Task Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#f8fafc;background:radial-gradient(circle at 15% 15%,#312e81,transparent 30%),radial-gradient(circle at 85% 85%,#164e63,transparent 30%),#070b16}
.box{width:min(430px,92%);padding:30px;border:1px solid #263246;border-radius:22px;background:rgba(15,23,42,.84);box-shadow:0 20px 60px #0007;backdrop-filter:blur(15px)}
.logo{text-align:center;font-size:42px}.title{text-align:center;margin:8px 0 6px}.sub{text-align:center;color:#94a3b8;margin-bottom:25px}label{display:block;margin:14px 0 7px;color:#cbd5e1}input{width:100%;padding:14px;border-radius:11px;border:1px solid #334155;background:#0b1220;color:white;outline:none}input:focus{border-color:#818cf8}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-weight:bold;cursor:pointer}.msg{min-height:22px;text-align:center;margin-top:14px;color:#fca5a5}.link{text-align:center;margin-top:18px;color:#94a3b8}.link a{color:#a5b4fc;text-decoration:none}
</style></head>
<body><main class="box">
<div class="logo">🚀</div><h1 class="title">Smart Task Manager</h1><p class="sub">سجّل الدخول لإدارة مهامك</p>
<form id="form"><label>البريد الإلكتروني</label><input id="email" type="email" required placeholder="example@email.com"><label>كلمة المرور</label><input id="password" type="password" required placeholder="••••••••"><button>تسجيل الدخول</button></form>
<div id="msg" class="msg"></div><div class="link">ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></div>
</main>
<script>
form.onsubmit=e=>{e.preventDefault();let users=JSON.parse(localStorage.getItem("stmUsers")||"[]");let u=users.find(x=>x.email===email.value.trim()&&x.password===password.value);if(!u){msg.textContent="البريد الإلكتروني أو كلمة المرور غير صحيحة";return}localStorage.setItem("stmCurrentUser",JSON.stringify({name:u.name,email:u.email}));location.href="index.html";}
</script></body></html>
