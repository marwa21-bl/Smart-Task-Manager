<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Task Manager</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,Tahoma,sans-serif;
      min-height:100vh;
      color:#f8fafc;
      background:
        radial-gradient(circle at 15% 10%,#312e81 0,transparent 28%),
        radial-gradient(circle at 85% 85%,#164e63 0,transparent 30%),
        #070b16;
    }
    .container{width:min(1150px,92%);margin:auto;padding:30px 0 50px}
    header{
      display:flex;justify-content:space-between;align-items:center;
      gap:20px;margin-bottom:30px
    }
    .brand h1{font-size:30px}
    .brand p{color:#94a3b8;margin-top:7px}
    .badge{
      padding:10px 15px;border:1px solid #334155;border-radius:999px;
      background:#111827;color:#a5b4fc;font-size:14px
    }
    .stats{
      display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px
    }
    .card{
      background:rgba(15,23,42,.78);
      border:1px solid rgba(148,163,184,.16);
      border-radius:18px;padding:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.2);
      backdrop-filter:blur(12px)
    }
    .stat-label{color:#94a3b8;font-size:14px}
    .stat-number{font-size:30px;font-weight:800;margin-top:10px}
    .layout{display:grid;grid-template-columns:330px 1fr;gap:20px}
    h2{font-size:20px;margin-bottom:18px}
    label{display:block;color:#cbd5e1;font-size:14px;margin:14px 0 7px}
    input,select{
      width:100%;padding:13px 14px;border-radius:11px;
      border:1px solid #334155;background:#0b1220;color:#fff;outline:none
    }
    input:focus,select:focus{border-color:#818cf8}
    button{
      border:0;border-radius:11px;padding:13px 16px;
      cursor:pointer;font-weight:700
    }
    .primary{width:100%;margin-top:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
    .primary:hover{transform:translateY(-1px)}
    .toolbar{display:flex;gap:10px;margin-bottom:18px}
    .toolbar input{flex:1}
    .tasks{display:grid;gap:12px}
    .task{
      display:flex;align-items:center;justify-content:space-between;gap:15px;
      padding:17px;border-radius:15px;background:#0b1220;
      border:1px solid #1e293b;animation:show .3s ease
    }
    @keyframes show{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .task-info{min-width:0}
    .task-title{font-size:16px;font-weight:700;margin-bottom:7px}
    .task-date{font-size:13px;color:#94a3b8}
    .status{
      display:inline-block;padding:6px 10px;border-radius:999px;
      font-size:12px;margin-top:9px
    }
    .new{background:#172554;color:#93c5fd}
    .progress{background:#3b2f12;color:#fcd34d}
    .done{background:#052e22;color:#6ee7b7}
    .actions{display:flex;gap:7px;flex-shrink:0}
    .actions button{padding:8px 10px;background:#172033;color:#cbd5e1}
    .actions .delete{background:#3f1515;color:#fca5a5}
    .empty{text-align:center;padding:45px 10px;color:#64748b}
    .footer{text-align:center;color:#64748b;margin-top:25px;font-size:13px}
    @media(max-width:800px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .layout{grid-template-columns:1fr}
    }
    @media(max-width:520px){
      .container{padding-top:20px}
      header{align-items:flex-start;flex-direction:column}
      .stats{grid-template-columns:1fr 1fr;gap:10px}
      .card{padding:15px}
      .task{align-items:flex-start;flex-direction:column}
      .actions{width:100%}
      .actions button{flex:1}
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="brand">
        <h1>🚀 Smart Task Manager</h1>
        <p>نظّم مهامك وأنجز عملك بذكاء</p>
      </div>
      <div class="badge">Frontend v1.0</div>
    </header>

    <section class="stats">
      <div class="card"><div class="stat-label">كل المهام</div><div class="stat-number" id="total">0</div></div>
      <div class="card"><div class="stat-label">جديدة</div><div class="stat-number" id="newCount">0</div></div>
      <div class="card"><div class="stat-label">قيد التنفيذ</div><div class="stat-number" id="progressCount">0</div></div>
      <div class="card"><div class="stat-label">مكتملة</div><div class="stat-number" id="doneCount">0</div></div>
    </section>

    <section class="layout">
      <div class="card">
        <h2>➕ إضافة مهمة</h2>
        <form id="taskForm">
          <label for="title">اسم المهمة</label>
          <input id="title" type="text" placeholder="مثال: تصميم الصفحة الرئيسية" required>

          <label for="date">تاريخ الانتهاء</label>
          <input id="date" type="date">

          <label for="status">الحالة</label>
          <select id="status">
            <option value="new">جديدة</option>
            <option value="progress">قيد التنفيذ</option>
            <option value="done">مكتملة</option>
          </select>

          <button class="primary" type="submit">إضافة المهمة</button>
        </form>
      </div>

      <div class="card">
        <h2>📋 قائمة المهام</h2>
        <div class="toolbar">
          <input id="search" type="search" placeholder="🔎 ابحث عن مهمة...">
          <select id="filter">
            <option value="all">كل الحالات</option>
            <option value="new">جديدة</option>
            <option value="progress">قيد التنفيذ</option>
            <option value="done">مكتملة</option>
          </select>
        </div>
        <div id="tasks" class="tasks"></div>
      </div>
    </section>

    <div class="footer">Smart Task Manager • مشروع Portfolio</div>
  </main>

<script>
  let tasks = JSON.parse(localStorage.getItem("smartTasks") || "[]");

  const form = document.getElementById("taskForm");
  const title = document.getElementById("title");
  const date = document.getElementById("date");
  const status = document.getElementById("status");
  const search = document.getElementById("search");
  const filter = document.getElementById("filter");
  const tasksBox = document.getElementById("tasks");

  const labels = {
    new: "جديدة",
    progress: "قيد التنفيذ",
    done: "مكتملة"
  };

  form.addEventListener("submit", function(e){
    e.preventDefault();

    tasks.unshift({
      id: Date.now(),
      title: title.value.trim(),
      date: date.value,
      status: status.value
    });

    save();
    form.reset();
    render();
  });

  function save(){
    localStorage.setItem("smartTasks", JSON.stringify(tasks));
  }

  function removeTask(id){
    tasks = tasks.filter(task => task.id !== id);
    save();
    render();
  }

  function changeStatus(id){
    const task = tasks.find(t => t.id === id);
    if(!task) return;

    task.status =
      task.status === "new" ? "progress" :
      task.status === "progress" ? "done" : "new";

    save();
    render();
  }

  function render(){
    const q = search.value.toLowerCase().trim();
    const selected = filter.value;

    const filtered = tasks.filter(task =>
      task.title.toLowerCase().includes(q) &&
      (selected === "all" || task.status === selected)
    );

    document.getElementById("total").textContent = tasks.length;
    document.getElementById("newCount").textContent = tasks.filter(t=>t.status==="new").length;
    document.getElementById("progressCount").textContent = tasks.filter(t=>t.status==="progress").length;
    document.getElementById("doneCount").textContent = tasks.filter(t=>t.status==="done").length;

    if(!filtered.length){
      tasksBox.innerHTML = '<div class="empty">لا توجد مهام حاليًا 🎯<br>أضف أول مهمة لك.</div>';
      return;
    }

    tasksBox.innerHTML = filtered.map(task => `
      <article class="task">
        <div class="task-info">
          <div class="task-title">${escapeHtml(task.title)}</div>
          <div class="task-date">${task.date ? "📅 " + task.date : "📅 بدون موعد نهائي"}</div>
          <span class="status ${task.status}">${labels[task.status]}</span>
        </div>
        <div class="actions">
          <button onclick="changeStatus(${task.id})">تغيير الحالة</button>
          <button class="delete" onclick="removeTask(${task.id})">حذف</button>
        </div>
      </article>
    `).join("");
  }

  function escapeHtml(text){
    return text.replace(/[&<>"']/g, char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#039;"
    }[char]));
  }

  search.addEventListener("input", render);
  filter.addEventListener("change", render);

  render();
</script>
</body>
</html>
